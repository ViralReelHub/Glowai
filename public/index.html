<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --surface-hover: #282a2c;
      --user-bubble: #2b2c2f;
      --text: #e3e3e3;
      --muted: #9aa0a6;
      --border: #333537;
      --gemini-grad: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Google Sans", "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: #e3e3e3;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .new-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .new-btn:hover {
      background: var(--surface-hover);
    }

    /* Main Chat Area */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
      scroll-behavior: smooth;
    }

    .chat-container {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Greeting State */
    .greeting {
      margin-top: 10vh;
      padding: 8px 4px;
      animation: fadeUp 0.35s ease;
    }

    .greeting h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 500;
      line-height: 1.15;
      background: var(--gemini-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      width: fit-content;
    }

    .greeting p {
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 24px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .sug-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .sug-card:hover {
      background: var(--surface-hover);
      transform: translateY(-1px);
    }

    /* Messages */
    .turn {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeUp 0.25s ease;
    }

    .user-wrap {
      display: flex;
      justify-content: flex-end;
    }

    .user-msg {
      background: var(--user-bubble);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 20px;
      max-width: 80%;
      font-size: 15.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-wrap {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .gemini-spark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      background: var(--gemini-grad);
      display: grid;
      place-items: center;
      font-size: 14px;
      color: #fff;
      font-weight: 700;
    }

    .gemini-spark.pulse {
      animation: spinPulse 1.3s linear infinite;
    }

    .ai-body {
      flex: 1;
      font-size: 15.5px;
      line-height: 1.7;
      color: var(--text);
      min-width: 0;
    }

    .ai-body p {
      margin-bottom: 12px;
    }

    .ai-body p:last-child {
      margin-bottom: 0;
    }

    .ai-body pre {
      background: #0b0b0c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .ai-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13.5px;
    }

    .ai-body ul, .ai-body ol {
      padding-left: 22px;
      margin-bottom: 12px;
    }

    .ai-body li {
      margin-bottom: 6px;
    }

    /* Bottom Floating Pill Input */
    .composer-area {
      padding: 8px 16px 20px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .composer-box {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 28px;
      padding: 10px 14px 10px 20px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: background 0.18s ease;
    }

    .composer-box:focus-within {
      background: var(--surface-hover);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15.5px;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      padding: 6px 0;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #e3e3e3;
      color: #131314;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .send-circle:hover:not(:disabled) {
      transform: scale(1.05);
    }

    .send-circle:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .disclaimer {
      max-width: 780px;
      margin: 8px auto 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spinPulse {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand-title">Gemini</div>
    <button class="new-btn" id="reset-btn">+ New chat</button>
  </div>

  <div class="chat-scroll" id="chat-scroll">
    <div class="chat-container" id="chat-container">
      <div class="greeting" id="greeting">
        <h1>Hello</h1>
        <p>How can I help you today?</p>
        <div class="suggestions">
          <div class="sug-card" onclick="sendPrompt('Give me 10 important SSC exam questions with answers')">Give me 10 important SSC exam questions</div>
          <div class="sug-card" onclick="sendPrompt('Write a clean HTML and CSS card component')">Write a clean HTML & CSS card component</div>
          <div class="sug-card" onclick="sendPrompt('Explain averages shortcut trick with one example')">Explain averages shortcut trick</div>
        </div>
      </div>
    </div>
  </div>

  <div class="composer-area">
    <form class="composer-box" id="composer">
      <textarea id="input" rows="1" placeholder="Ask Gemini" required></textarea>
      <button type="submit" class="send-circle" id="send-btn" title="Send">↑</button>
    </form>
    <div class="disclaimer">Gemini may display inaccurate info, including about people, so double-check its responses.</div>
  </div>

  <script>
    const chatScroll = document.getElementById("chat-scroll");
    const chatContainer = document.getElementById("chat-container");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");

    let history = [];

    function scrollToBottom() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function autoGrow() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    function removeGreeting() {
      const g = document.getElementById("greeting");
      if (g) g.remove();
    }

    function addUserMessage(text) {
      removeGreeting();
      const turn = document.createElement("div");
      turn.className = "turn";
      turn.innerHTML = `
        <div class="user-wrap">
          <div class="user-msg"></div>
        </div>
      `;
      turn.querySelector(".user-msg").textContent = text;
      chatContainer.appendChild(turn);
      scrollToBottom();
      return turn;
    }

    function addAiMessage(turn, text, isLoading = false) {
      let aiWrap = turn.querySelector(".ai-wrap");
      if (!aiWrap) {
        aiWrap = document.createElement("div");
        aiWrap.className = "ai-wrap";
        aiWrap.innerHTML = `
          <div class="gemini-spark ${isLoading ? "pulse" : ""}">✦</div>
          <div class="ai-body"></div>
        `;
        turn.appendChild(aiWrap);
      }

      const spark = aiWrap.querySelector(".gemini-spark");
      const body = aiWrap.querySelector(".ai-body");

      if (isLoading) {
        spark.classList.add("pulse");
        body.textContent = text;
      } else {
        spark.classList.remove("pulse");
        body.innerHTML = window.marked ? marked.parse(text) : text;
      }
      scrollToBottom();
    }

    async function sendPrompt(text) {
      const clean = text.trim();
      if (!clean) return;

      const turn = addUserMessage(clean);
      addAiMessage(turn, "Thinking...", true);

      input.value = "";
      autoGrow();
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: clean, history }),
        });
        const data = await res.json();
        const reply = res.ok ? data.reply : (data.error || "Error generating response.");

        addAiMessage(turn, reply, false);
        history.push({ role: "user", text: clean }, { role: "model", text: reply });
      } catch (err) {
        addAiMessage(turn, "Network error. Please try again.", false);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    input.addEventListener("input", autoGrow);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt(input.value);
      }
    });

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      sendPrompt(input.value);
    });

    resetBtn.addEventListener("click", () => {
      history = [];
      chatContainer.innerHTML = `
        <div class="greeting" id="greeting">
          <h1>Hello</h1>
          <p>How can I help you today?</p>
          <div class="suggestions">
            <div class="sug-card" onclick="sendPrompt('Give me 10 important SSC exam questions with answers')">Give me 10 important SSC exam questions</div>
            <div class="sug-card" onclick="sendPrompt('Write a clean HTML and CSS card component')">Write a clean HTML & CSS card component</div>
            <div class="sug-card" onclick="sendPrompt('Explain averages shortcut trick with one example')">Explain averages shortcut trick</div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
