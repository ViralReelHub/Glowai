<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlowAI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #121316;
      --elevated: #1c1d21;
      --hover: #25272d;
      --text: #eceef2;
      --muted: #9aa0a6;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6c8cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Google Sans", "Inter", system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Header */
    .topbar {
      height: 58px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--surface);
    }

    .brand-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 12px;
      text-align: left;
    }

    .brand-picker:hover {
      background: var(--surface);
    }

    .brand-main {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .brand-sub {
      font-size: 15px;
      color: var(--muted);
      font-weight: 400;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Mode Selector Popover */
    .mode-menu {
      position: fixed;
      top: 56px;
      left: 56px;
      width: 280px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 50;
    }

    .mode-menu.open {
      display: flex;
    }

    .mode-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      width: 100%;
    }

    .mode-item:hover {
      background: var(--hover);
    }

    .mode-title {
      font-size: 16px;
      font-weight: 500;
      display: block;
    }

    .mode-desc {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    .badge-new {
      font-size: 12px;
      background: #2c303a;
      color: #d0d7de;
      padding: 3px 8px;
      border-radius: 999px;
      align-self: center;
    }

    /* Right '...' Action Menu */
    .action-menu {
      position: fixed;
      top: 56px;
      right: 14px;
      width: 235px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 50;
    }

    .action-menu.open {
      display: flex;
    }

    .action-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }

    .action-item:hover {
      background: var(--hover);
    }

    /* Full-Screen Navigation Drawer */
    .drawer {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 60;
      display: none;
      flex-direction: column;
      padding: 12px 16px 14px;
    }

    .drawer.open {
      display: flex;
    }

    .drawer-top {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .drawer-brand {
      font-size: 22px;
      font-weight: 500;
    }

    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 12px;
    }

    .drawer-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 13px 10px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }

    .drawer-link:hover {
      background: var(--surface);
    }

    .section-title {
      font-size: 14px;
      color: var(--muted);
      padding: 14px 10px 8px;
      font-weight: 400;
    }

    .recent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 12px;
      border-radius: 14px;
      cursor: pointer;
      color: var(--text);
      font-size: 15px;
    }

    .recent-row.active, .recent-row:hover {
      background: var(--surface);
    }

    .recent-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .drawer-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-ring {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4285f4, #9b72cb);
      display: grid;
      place-items: center;
      font-weight: 600;
      color: #fff;
      font-size: 15px;
    }

    .user-name {
      font-size: 15px;
      font-weight: 500;
      display: block;
    }

    .user-tier {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: block;
    }

    /* Chat Stream */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 20px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 100%;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }

    .empty-state h2 {
      color: var(--text);
      font-size: 26px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .turn {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-msg-row {
      display: flex;
      justify-content: flex-end;
    }

    .user-bubble {
      background: var(--elevated);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 20px;
      max-width: 82%;
      font-size: 15.5px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ai-msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .ai-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
      display: grid;
      place-items: center;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .ai-content {
      flex: 1;
      font-size: 15.5px;
      line-height: 1.65;
      color: var(--text);
      min-width: 0;
    }

    .ai-content p { margin-bottom: 10px; }
    .ai-content p:last-child { margin-bottom: 0; }
    .ai-content pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
    }

    /* Bottom Composer Pill */
    .composer-wrap {
      padding: 6px 14px 16px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .composer-pill {
      max-width: 780px;
      margin: 0 auto;
      background: var(--elevated);
      border-radius: 30px;
      padding: 8px 10px 8px 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border: 1px solid transparent;
    }

    .composer-pill:focus-within {
      border-color: var(--border);
    }

    .plus-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 24px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .plus-btn:hover {
      background: var(--hover);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
      resize: none;
      max-height: 150px;
      padding: 7px 2px;
    }

    textarea::placeholder {
      color: #b0b5bd;
    }

    .stop-send-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: none;
      background: var(--hover);
      color: var(--text);
      font-size: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .stop-send-btn.ready {
      background: var(--text);
      color: var(--bg);
      border-radius: 50%;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="top-left">
      <button class="icon-btn" id="open-drawer" title="Menu">☰</button>
      <button class="brand-picker" id="mode-toggle">
        <span class="brand-main">GlowAI</span>
        <span class="brand-sub" id="mode-label">Auto ⌄</span>
      </button>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="quick-new" title="New chat">✎</button>
      <button class="icon-btn" id="more-toggle" title="More options">⋮</button>
    </div>
  </header>

  <!-- Mode Selector Dropdown -->
  <div class="mode-menu" id="mode-menu">
    <button class="mode-item" data-mode="Auto">
      <div>
        <span class="mode-title">Auto</span>
        <span class="mode-desc">Adapts to your needs</span>
      </div>
      <span>✓</span>
    </button>
    <button class="mode-item" data-mode="Everyday help">
      <div>
        <span class="mode-title">Everyday help</span>
        <span class="mode-desc">Fast answers & daily tasks</span>
      </div>
    </button>
    <button class="mode-item" data-mode="Deeper analysis">
      <div>
        <span class="mode-title">Deeper analysis</span>
        <span class="mode-desc">Step-by-step reasoning</span>
      </div>
      <span class="badge-new">New</span>
    </button>
    <button class="mode-item" data-mode="Code and complex work">
      <div>
        <span class="mode-title">Code and complex work</span>
        <span class="mode-desc">Programming & architecture</span>
      </div>
      <span>🔒</span>
    </button>
  </div>

  <!-- Top-Right Action Menu -->
  <div class="action-menu" id="action-menu">
    <button class="action-item" id="act-share">⤴ Share conversation</button>
    <button class="action-item" id="act-pin">📌 Pin</button>
    <button class="action-item" id="act-rename">✎ Rename</button>
    <button class="action-item" id="act-help">? Help</button>
    <button class="action-item" id="act-feedback">! Feedback</button>
    <button class="action-item" id="act-delete">🗑 Delete</button>
  </div>

  <!-- Navigation Drawer -->
  <nav class="drawer" id="drawer">
    <div class="drawer-top">
      <span class="drawer-brand">GlowAI</span>
      <div>
        <button class="icon-btn" id="drawer-search" title="Search">🔍</button>
        <button class="icon-btn" id="close-drawer" title="Close">✕</button>
      </div>
    </div>
    <div class="drawer-scroll">
      <button class="drawer-link" id="drawer-new-chat">✎ <span>New chat</span></button>
      <button class="drawer-link" onclick="alert('GlowAI Library')">⊞ <span>Library</span></button>
      <button class="drawer-link" onclick="alert('Image generation coming soon')">🖼 <span>Images</span></button>
      <button class="drawer-link" onclick="alert('Scheduled tasks')">🕒 <span>Scheduled</span></button>
      <button class="drawer-link" onclick="alert('Customise GlowAI')">⚙ <span>Customise</span></button>
      <button class="drawer-link" onclick="alert('Video tools')">🎬 <span>Videos</span></button>

      <div class="section-title">Notebooks</div>
      <button class="drawer-link" id="add-notebook">+ <span>New notebook</span></button>

      <div class="section-title" id="filter-label">All</div>
      <div id="drawer-history"></div>
    </div>
    <div class="drawer-footer">
      <div class="user-card">
        <div class="avatar-ring">G</div>
        <div>
          <span class="user-name">GlowAI User</span>
          <span class="user-tier">PRO</span>
        </div>
      </div>
      <button class="icon-btn" onclick="alert('Settings')">⚙</button>
    </div>
  </nav>

  <!-- Main Chat View -->
  <main class="chat-area" id="chat-area">
    <div class="chat-inner" id="chat-inner"></div>
  </main>

  <!-- Bottom Floating Pill Input -->
  <div class="composer-wrap">
    <form class="composer-pill" id="composer">
      <button type="button" class="plus-btn" id="plus-btn" title="New prompt">+</button>
      <textarea id="prompt" rows="1" placeholder="Ask GlowAI" required></textarea>
      <button type="submit" class="stop-send-btn" id="action-btn" title="Send">■</button>
    </form>
  </div>

  <script>
    const drawer = document.getElementById("drawer");
    const modeMenu = document.getElementById("mode-menu");
    const actionMenu = document.getElementById("action-menu");
    const modeLabel = document.getElementById("mode-label");
    const chatArea = document.getElementById("chat-area");
    const chatInner = document.getElementById("chat-inner");
    const composer = document.getElementById("composer");
    const promptEl = document.getElementById("prompt");
    const actionBtn = document.getElementById("action-btn");
    const drawerHistory = document.getElementById("drawer-history");

    let currentMode = "Auto";
    let chats = JSON.parse(localStorage.getItem("glowai_exact_chats") || "[]");
    let activeId = null;
    let isGenerating = false;

    if (chats.length === 0) {
      chats = [{ id: "default", title: "AI App Publishing Guide", pinned: false, messages: [] }];
    }
    activeId = chats[0].id;

    function saveChats() {
      localStorage.setItem("glowai_exact_chats", JSON.stringify(chats));
      renderDrawerHistory();
    }

    function getActiveChat() {
      return chats.find((c) => c.id === activeId) || chats[0];
    }

    function closePopovers() {
      modeMenu.classList.remove("open");
      actionMenu.classList.remove("open");
    }

    function renderDrawerHistory() {
      drawerHistory.innerHTML = "";
      const sorted = [...chats].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      sorted.forEach((c) => {
        const row = document.createElement("div");
        row.className = "recent-row" + (c.id === activeId ? " active" : "");
        row.innerHTML = `<span class="recent-title">${c.pinned ? "📌 " : ""}${c.title}</span>`;
        row.onclick = () => {
          activeId = c.id;
          saveChats();
          renderMessages();
          drawer.classList.remove("open");
        };
        drawerHistory.appendChild(row);
      });
    }

    function renderMessages() {
      const chat = getActiveChat();
      chatInner.innerHTML = "";
      if (!chat.messages.length) {
        chatInner.innerHTML = `
          <div class="empty-state">
            <h2>GlowAI</h2>
            <p>Ask anything to start a conversation.</p>
          </div>
        `;
        return;
      }

      chat.messages.forEach((m) => {
        const turn = document.createElement("div");
        turn.className = "turn";
        if (m.role === "user") {
          turn.innerHTML = `<div class="user-msg-row"><div class="user-bubble"></div></div>`;
          turn.querySelector(".user-bubble").textContent = m.text;
        } else {
          turn.innerHTML = `
            <div class="ai-msg-row">
              <div class="ai-mark">✦</div>
              <div class="ai-content">${window.marked ? marked.parse(m.text) : m.text}</div>
            </div>
          `;
        }
        chatInner.appendChild(turn);
      });
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function updateActionIcon() {
      if (isGenerating) {
        actionBtn.textContent = "■";
        actionBtn.classList.remove("ready");
      } else if (promptEl.value.trim().length > 0) {
        actionBtn.textContent = "↑";
        actionBtn.classList.add("ready");
      } else {
        actionBtn.textContent = "■";
        actionBtn.classList.remove("ready");
      }
    }

    function autoResize() {
      promptEl.style.height = "auto";
      promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + "px";
      updateActionIcon();
    }

    function newChat() {
      const id = Date.now().toString();
      chats.unshift({ id, title: "New chat", pinned: false, messages: [] });
      activeId = id;
      saveChats();
      renderMessages();
      drawer.classList.remove("open");
      closePopovers();
    }

    async function sendMessage(text) {
      const clean = text.trim();
      if (!clean || isGenerating) return;

      const chat = getActiveChat();
      if (chat.messages.length === 0) {
        chat.title = clean.slice(0, 34);
      }

      chat.messages.push({ role: "user", text: clean });
      saveChats();
      renderMessages();

      promptEl.value = "";
      autoResize();
      isGenerating = true;
      updateActionIcon();

      const tempTurn = document.createElement("div");
      tempTurn.className = "turn";
      tempTurn.innerHTML = `
        <div class="ai-msg-row">
          <div class="ai-mark">✦</div>
          <div class="ai-content">Thinking...</div>
        </div>
      `;
      chatInner.appendChild(tempTurn);
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        const historyPayload = chat.messages.slice(0, -1).slice(-10);
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: clean, history: historyPayload, mode: currentMode }),
        });
        const data = await res.json();
        const reply = res.ok ? data.reply : (data.error || "Error generating response.");
        chat.messages.push({ role: "model", text: reply });
        saveChats();
      } catch (err) {
        chat.messages.push({ role: "model", text: "Network error. Please try again." });
        saveChats();
      } finally {
        isGenerating = false;
        renderMessages();
        updateActionIcon();
      }
    }

       // Event bindings
    document.getElementById("open-drawer").onclick = (e) => { e.stopPropagation(); closePopovers(); drawer.classList.add("open"); };
    document.getElementById("close-drawer").onclick = () => drawer.classList.remove("open");
    document.getElementById("quick-new").onclick = newChat;
    document.getElementById("drawer-new-chat").onclick = newChat;
    document.getElementById("plus-btn").onclick = () => { promptEl.value = ""; autoResize(); promptEl.focus(); };

    document.getElementById("mode-toggle").onclick = (e) => {
      e.stopPropagation();
      actionMenu.classList.remove("open");
      modeMenu.classList.toggle("open");
    };

    document.querySelectorAll(".mode-item").forEach((btn) => {
      btn.onclick = () => {
        currentMode = btn.dataset.mode;
        modeLabel.textContent = currentMode + " ⌄";
        document.querySelectorAll(".mode-item span:last-child").forEach((s) => {
          if (s.textContent === "✓") s.textContent = "";
        });
        const check = document.createElement("span");
        check.textContent = "✓";
        btn.appendChild(check);
        closePopovers();
      };
    });

    document.getElementById("more-toggle").onclick = (e) => {
      e.stopPropagation();
      modeMenu.classList.remove("open");
      actionMenu.classList.toggle("open");
    };

    document.getElementById("act-share").onclick = () => {
      navigator.clipboard?.writeText(location.href);
      alert("Link copied!");
      closePopovers();
    };

    document.getElementById("act-pin").onclick = () => {
      const chat = getActiveChat();
      chat.pinned = !chat.pinned;
      saveChats();
      closePopovers();
    };

    document.getElementById("act-rename").onclick = () => {
      const chat = getActiveChat();
      const next = prompt("New chat title:", chat.title);
      if (next && next.trim()) {
        chat.title = next.trim();
        saveChats();
      }
      closePopovers();
    };

    document.getElementById("act-help").onclick = () => { alert("GlowAI Help: Type any question below."); closePopovers(); };
    document.getElementById("act-feedback").onclick = () => { alert("Feedback noted."); closePopovers(); };

    document.getElementById("act-delete").onclick = () => {
      const chat = getActiveChat();
      chat.messages = [];
      saveChats();
      renderMessages();
      closePopovers();
    };

    document.getElementById("add-notebook").onclick = () => {
      const name = prompt("Notebook name:");
      if (name && name.trim()) {
        chats.unshift({ id: Date.now().toString(), title: name.trim(), pinned: false, messages: [] });
        activeId = chats[0].id;
        saveChats();
        renderMessages();
        drawer.classList.remove("open");
      }
    };

    document.addEventListener("click", closePopovers);

    promptEl.addEventListener("input", autoResize);
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(promptEl.value);
      }
    });

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(promptEl.value);
    });

    renderDrawerHistory();
    renderMessages();
    updateActionIcon();
  </script>
</body>
</html>
