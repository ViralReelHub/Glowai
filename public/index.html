<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlowAI — Next-Gen AI Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --panel: #0d111a;
      --card: #131926;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --cyan: #22d3ee;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }

    /* Sidebar */
    aside {
      width: 260px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 14px; transition: transform 0.25s ease; z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; padding: 6px 4px 16px; }
    .logo-orb {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .new-chat-btn {
      width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(34,211,238,0.1));
      color: #fff; font-weight: 600; cursor: pointer; text-align: left; display: flex; justify-content: space-between;
    }
    .new-chat-btn:hover { border-color: var(--accent); }
    .history-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 4px 8px; }
    #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .hist-item {
      padding: 9px 11px; border-radius: 8px; font-size: 13px; color: var(--muted);
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hist-item:hover, .hist-item.active { background: var(--card); color: #fff; }

    /* Main Area */
    main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
    header {
      height: 56px; padding: 0 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(12px);
    }
    .left-head { display: flex; align-items: center; gap: 12px; }
    .menu-btn { display: none; background: var(--card); border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    .model-pill {
      font-size: 12px; padding: 5px 11px; border-radius: 999px;
      background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.3); color: var(--cyan);
    }

    /* Chat Container */
    #chat { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 18px; }
    .welcome {
      margin: auto; max-width: 620px; text-align: center; padding: 20px;
    }
    .welcome h1 {
      font-size: 28px; background: linear-gradient(90deg, #fff, var(--cyan), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
    }
    .welcome p { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
    .chip {
      background: var(--card); border: 1px solid var(--border); padding: 13px; border-radius: 12px;
      font-size: 13px; color: #cbd5e1; cursor: pointer; transition: 0.2s;
    }
    .chip:hover { border-color: var(--accent); transform: translateY(-2px); }

    .msg-row { max-width: 820px; width: 100%; margin: 0 auto; display: flex; gap: 12px; }
    .msg-row.user { justify-content: flex-end; }
    .avatar {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center;
      font-size: 13px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--cyan));
    }
    .bubble {
      max-width: 84%; padding: 13px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6;
      overflow-wrap: break-word;
    }
    .user .bubble {
      background: linear-gradient(135deg, #4f46e5, #2563eb); color: #fff; border-bottom-right-radius: 4px;
    }
    .ai .bubble {
      background: var(--card); border: 1px solid var(--border); color: #e2e8f0; border-bottom-left-radius: 4px;
    }
    .ai .bubble pre { background: #07090e; padding: 12px; border-radius: 10px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
    .ai .bubble code { font-family: monospace; font-size: 13px; }
    .ai .bubble p { margin-bottom: 8px; }
    .ai .bubble p:last-child { margin-bottom: 0; }
    .msg-actions { margin-top: 8px; display: flex; gap: 8px; }
    .copy-btn {
      font-size: 11px; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--muted); padding: 3px 8px; border-radius: 6px; cursor: pointer;
    }
    .copy-btn:hover { color: #fff; }

    /* Input Dock */
    .dock-wrap { padding: 12px 16px 18px; background: linear-gradient(to top, var(--bg) 75%, transparent); }
    form {
      max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 8px 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    textarea {
      flex: 1; background: transparent; border: none; color: #fff; font-size: 15px;
      resize: none; max-height: 130px; padding: 6px; outline: none; line-height: 1.4;
    }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer;
      display: grid; place-items: center; font-size: 16px; transition: 0.2s;
    }
    #mic-btn { background: rgba(255,255,255,0.06); color: var(--muted); }
    #mic-btn.listening { background: #ef4444; color: #fff; }
    #send-btn { background: linear-gradient(135deg, var(--accent), #2563eb); color: #fff; font-weight: 700; }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-width: 768px) {
      aside { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      aside.open { transform: translateX(0); }
      .menu-btn { display: inline-block; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><div class="logo-orb"></div> GlowAI</div>
    <button class="new-chat-btn" id="new-chat">+ New Chat <span>⌘K</span></button>
    <div class="history-label">Recent Chats</div>
    <div id="history-list"></div>
  </aside>

  <main>
    <header>
      <div class="left-head">
        <button class="menu-btn" id="menu-btn">☰</button>
        <strong>GlowAI Studio</strong>
      </div>
      <span class="model-pill">⚡ Gemini 2.5 Flash</span>
    </header>

    <div id="chat"></div>

    <div class="dock-wrap">
      <form id="chat-form">
        <button type="button" class="icon-btn" id="mic-btn" title="Voice Input">🎤</button>
        <textarea id="prompt" rows="1" placeholder="Ask GlowAI anything..." required></textarea>
        <button type="submit" class="icon-btn" id="send-btn" title="Send">➤</button>
      </form>
    </div>
  </main>

  <script>
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");
    const historyList = document.getElementById("history-list");
    const sidebar = document.getElementById("sidebar");

    let sessions = JSON.parse(localStorage.getItem("glowai_sessions") || "[]");
    let currentId = null;

    function saveSessions() {
      localStorage.setItem("glowai_sessions", JSON.stringify(sessions));
      renderSidebar();
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentId);
    }

    function startNewChat() {
      currentId = Date.now().toString();
      sessions.unshift({ id: currentId, title: "New Conversation", messages: [] });
      saveSessions();
      renderChat();
      sidebar.classList.remove("open");
    }

    function renderSidebar() {
      historyList.innerHTML = "";
      sessions.forEach(s => {
        const div = document.createElement("div");
        div.className = "hist-item" + (s.id === currentId ? " active" : "");
        div.textContent = s.title;
        div.onclick = () => { currentId = s.id; renderSidebar(); renderChat(); sidebar.classList.remove("open"); };
        historyList.appendChild(div);
      });
    }

    function renderWelcome() {
      chatEl.innerHTML = `
        <div class="welcome">
          <h1>Welcome to GlowAI</h1>
          <p>Next-gen AI assistant for coding, exam prep, writing, and instant answers.</p>
          <div class="chips">
            <div class="chip" onclick="quickAsk('Mujhe SSC exam ke 20 important GK/GS questions with answers do')">📚 SSC Exam 20 GK Questions</div>
            <div class="chip" onclick="quickAsk('Ek modern portfolio website ka HTML/CSS code likho')">💻 Generate Website Code</div>
            <div class="chip" onclick="quickAsk('Mujhe daily study aur business manage karne ka smart routine banao')">⚡ Smart Productivity Plan</div>
          </div>
        </div>
      `;
    }

    function appendBubble(role, text, isTemp = false) {
      const welcome = chatEl.querySelector(".welcome");
      if (welcome) welcome.remove();

      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      if (role === "ai") {
        const av = document.createElement("div");
        av.className = "avatar";
        av.textContent = "G";
        row.appendChild(av);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "ai" && !isTemp && window.marked) {
        bubble.innerHTML = marked.parse(text);
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = () => { navigator.clipboard.writeText(text); copyBtn.textContent = "Copied!"; setTimeout(() => copyBtn.textContent = "Copy", 1500); };
        actions.appendChild(copyBtn);
        bubble.appendChild(actions);
      } else {
        bubble.textContent = text;
      }

      row.appendChild(bubble);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
      return row;
    }

    function renderChat() {
      const session = getCurrentSession();
      if (!session || session.messages.length === 0) return renderWelcome();
      chatEl.innerHTML = "";
      session.messages.forEach(m => appendBubble(m.role, m.text));
    }

    window.quickAsk = (q) => {
      promptEl.value = q;
      form.dispatchEvent(new Event("submit"));
    };

    promptEl.addEventListener("input", () => {
      promptEl.style.height = "auto";
      promptEl.style.height = promptEl.scrollHeight + "px";
    });

    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = promptEl.value.trim();
      if (!text) return;

      let session = getCurrentSession();
      if (!session) { startNewChat(); session = getCurrentSession(); }
      if (session.messages.length === 0) session.title = text.slice(0, 32);

      appendBubble("user", text);
      session.messages.push({ role: "user", text });
      saveSessions();

      promptEl.value = "";
      promptEl.style.height = "auto";
      sendBtn.disabled = true;

      const loader = appendBubble("ai", "Thinking...", true);

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: session.messages.slice(0, -1) })
        });
        const data = await res.json();
        loader.remove();

        const reply = res.ok ? data.reply : (data.error || "Error generating response.");
        appendBubble("ai", reply);
        session.messages.push({ role: "ai", text: reply });
        saveSessions();
      } catch (err) {
        loader.remove();
        appendBubble("ai", "Network error. Please check connection.");
      } finally {
        sendBtn.disabled = false;
        promptEl.focus();
      }
    });

    // Voice input
    const micBtn = document.getElementById("mic-btn");
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.lang = "en-IN";
      micBtn.onclick = () => { rec.start(); micBtn.classList.add("listening"); };
      rec.onresult = (e) => { promptEl.value = e.results[0][0].transcript; };
      rec.onend = () => micBtn.classList.remove("listening");
    } else {
      micBtn.style.display = "none";
    }

    document.getElementById("new-chat").onclick = startNewChat;
    document.getElementById("menu-btn").onclick = () => sidebar.classList.toggle("open");

    if (sessions.length > 0) {
      currentId = sessions[0].id;
      renderSidebar();
      renderChat();
    } else {
      startNewChat();
    }
  </script>
</body>
</html>
