<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>GlowAI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #090a0d;
      --panel: #111318;
      --card: #181b22;
      --card-hover: #21252f;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f5f8;
      --muted: #8e96a4;
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 10, 13, 0.9);
      backdrop-filter: blur(12px);
      z-index: 20;
      flex-shrink: 0;
    }

    .top-group { display: flex; align-items: center; gap: 8px; }

    .btn-ghost {
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-ghost:hover { background: var(--card); border-color: var(--border); }

    .brand-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
    }

    .mode-pill {
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .popover {
      position: fixed;
      top: 50px;
      width: 225px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 50;
    }
    .popover.open { display: flex; }
    #mode-popover { left: 88px; }
    #menu-popover { right: 14px; width: 185px; }

    .pop-item {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
    }
    .pop-item:hover { background: var(--card-hover); }
    .pop-sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
      display: none; z-index: 60;
    }
    .drawer-backdrop.open { display: block; }

    .drawer {
      width: 270px; max-width: 82vw; height: 100%;
      background: var(--panel); border-right: 1px solid var(--border);
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item {
      padding: 9px 11px; border-radius: 10px; font-size: 13.5px;
      color: var(--muted); cursor: pointer; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .history-item:hover, .history-item.active { background: var(--card); color: var(--text); }

    .chat-stage { flex: 1; overflow-y: auto; padding: 16px 14px 20px; scroll-behavior: smooth; }
    .chat-container {
      max-width: 740px; margin: 0 auto; display: flex;
      flex-direction: column; gap: 18px; min-height: 100%;
    }

    .hero-empty { margin: auto; text-align: center; max-width: 430px; padding: 16px; }
    .hero-empty h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
    .hero-empty p { font-size: 13.5px; color: var(--muted); }

    .quick-grid {
      margin-top: 16px; display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 8px; text-align: left;
    }
    .quick-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 11px 12px; color: var(--text); font-size: 12.5px; cursor: pointer;
    }
    .quick-card:hover { border-color: rgba(99, 102, 241, 0.5); }

    .msg-user {
      align-self: flex-end; max-width: 82%; display: flex;
      flex-direction: column; align-items: flex-end; gap: 6px;
    }
    .bubble-user {
      background: #272b36; color: #fff; padding: 10px 15px;
      border-radius: 18px 18px 4px 18px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap;
    }
    .thumb-user { max-width: 200px; border-radius: 12px; border: 1px solid var(--border); }
    .file-chip-user {
      background: var(--card); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 10px; font-size: 12px; color: var(--muted);
    }

    .msg-ai { display: flex; gap: 10px; align-items: flex-start; }
    .ai-avatar {
      width: 26px; height: 26px; border-radius: 50%; background: var(--card);
      border: 1px solid var(--border); display: grid; place-items: center;
      font-size: 12px; color: #a5b4fc; flex-shrink: 0; margin-top: 3px;
    }
    .ai-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .ai-box {
      font-size: 14.5px; line-height: 1.65; color: var(--text);
    }
    .ai-box p { margin-bottom: 10px; }
    .ai-box p:last-child { margin-bottom: 0; }
    .ai-box ul, .ai-box ol { padding-left: 18px; margin-bottom: 10px; }
    .ai-box pre {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; overflow-x: auto; margin: 8px 0; font-size: 13px;
    }
    .ai-box table {
      width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px;
    }
    .ai-box th, .ai-box td {
      border: 1px solid var(--border); padding: 7px 10px; text-align: left;
    }
    .ai-box th { background: var(--card); }

    .ai-tools { display: flex; gap: 6px; align-items: center; }
    .chip-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      font-size: 11.5px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    }
    .chip-btn:hover { color: var(--text); background: var(--card-hover); }

    .typing-dots { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: blink 1.1s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    .dock {
      padding: 8px 12px 14px;
      background: var(--bg);
      flex-shrink: 0;
      position: relative;
    }

    .dock-inner { max-width: 740px; margin: 0 auto; position: relative; }

    .attach-menu {
      position: absolute;
      bottom: 58px;
      left: 4px;
      width: 190px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 40;
    }
    .attach-menu.open { display: flex; }

    .attach-bar {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .attach-bar.show { display: flex; }
    .attach-bar img { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; }
    .attach-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .x-btn { background: transparent; border: none; color: var(--text); font-size: 15px; cursor: pointer; }

    .input-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 6px 8px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .input-pill:focus-within { border-color: rgba(255, 255, 255, 0.22); }

    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .circle-btn:hover { background: var(--card-hover); color: var(--text); }
    .circle-btn.active-mic { background: #dc2626; color: #fff; }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      line-height: 1.45;
      max-height: 140px;
      resize: none;
      padding: 7px 4px;
    }
    textarea::placeholder { color: var(--muted); }

    .send-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--card-hover);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-circle.go { background: #f3f5f8; color: #090a0d; }
  </style>
</head>
<body>
  <input type="file" id="img-file" accept="image/*" hidden />
  <input type="file" id="doc-file" accept=".pdf,.txt,.md,.csv,.json,application/pdf,text/plain" hidden />

  <header class="topbar">
    <div class="top-group">
      <button class="btn-ghost" id="btn-drawer" title="History">☰</button>
      <div class="btn-ghost" style="cursor:default;">
        <span class="brand-dot"></span>
        <span style="font-size:16px;font-weight:600;">GlowAI</span>
      </div>
      <button class="mode-pill" id="btn-mode">
        <span id="mode-text">Auto</span>
        <span>▾</span>
      </button>
    </div>
    <div class="top-group">
      <button class="btn-ghost" id="btn-new">+ New</button>
      <button class="btn-ghost" id="btn-menu">⋮</button>
    </div>
  </header>

  <div class="popover" id="mode-popover">
    <button class="pop-item" data-mode="Auto">
      <div><strong>Auto</strong><span class="pop-sub">Fast & verified</span></div>
      <span class="chk">✓</span>
    </button>
    <button class="pop-item" data-mode="Deeper analysis">
      <div><strong>Deeper analysis</strong><span class="pop-sub">Step-by-step reasoning</span></div>
      <span class="chk"></span>
    </button>
    <button class="pop-item" data-mode="Code and complex work">
      <div><strong>Code & work</strong><span class="pop-sub">Clean code & logic</span></div>
      <span class="chk"></span>
    </button>
  </div>

  <div class="popover" id="menu-popover">
    <button class="pop-item" id="opt-clear">Clear chat</button>
    <button class="pop-item" id="opt-reset">Reset app</button>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop">
    <aside class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-head">
        <strong>History</strong>
        <button class="btn-ghost" id="btn-close-drawer">✕</button>
      </div>
      <button class="btn-ghost" id="drawer-new" style="justify-content:center; border:1px solid var(--border);">+ New Chat</button>
      <div class="history-list" id="history-list"></div>
    </aside>
  </div>

  <main class="chat-stage" id="chat-stage">
    <div class="chat-container" id="chat-container"></div>
  </main>

  <div class="dock">
    <div class="dock-inner">
      <div class="attach-menu" id="attach-menu">
        <button type="button" class="pop-item" id="pick-img">Upload Photo</button>
        <button type="button" class="pop-item" id="pick-doc">Upload PDF / Doc</button>
      </div>

      <div class="attach-bar" id="attach-bar">
        <img id="attach-img" alt="Preview" style="display:none;" />
        <span id="attach-doc-ico" style="display:none;">File</span>
        <span class="attach-name" id="attach-label"></span>
        <button type="button" class="x-btn" id="btn-unattach">✕</button>
      </div>

      <form class="input-pill" id="chat-form">
        <button type="button" class="circle-btn" id="btn-plus" title="Attach">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <textarea id="inp" rows="1" placeholder="Ask GlowAI"></textarea>
        <button type="button" class="circle-btn" id="btn-mic" title="Voice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button type="submit" class="send-circle" id="btn-send" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    }

    const STORAGE_KEY = "glowai_v5_sessions";
    let mode = "Auto";
    let busy = false;
    let filePayload = null;

    let sessions = [];
    try {
      sessions = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "[]");
    } catch (_) {
      sessions = [];
    }

    const freshId = "s_" + Date.now();
    sessions.unshift({ id: freshId, title: "New chat", messages: [] });
    sessions = sessions.slice(0, 15);
    let activeSessionId = freshId;

    const el = (id) => document.getElementById(id);

    function persist() {
      try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch (_) {}
      renderHistory();
    }

    function currentSession() {
      return sessions.find((s) => s.id === activeSessionId) || sessions[0];
    }

    function closePopovers() {
      el("mode-popover").classList.remove("open");
      el("menu-popover").classList.remove("open");
      el("attach-menu").classList.remove("open");
    }

    function clearFile() {
      filePayload = null;
      el("attach-img").style.display = "none";
      el("attach-doc-ico").style.display = "none";
      el("attach-label").textContent = "";
      el("attach-bar").classList.remove("show");
      el("img-file").value = "";
      el("doc-file").value = "";
      syncSendButton();
    }

    function onImagePicked(file) {
      if (!file) return;
      clearFile();
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 960;
          let { width, height } = img;
          if (width > max || height > max) {
            if (width > height) { height = Math.round((height * max) / width); width = max; }
            else { width = Math.round((width * max) / height); height = max; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          filePayload = {
            kind: "image",
            dataUrl,
            base64: dataUrl.split(",")[1],
            mimeType: "image/jpeg",
            name: file.name,
          };
          el("attach-img").src = dataUrl;
          el("attach-img").style.display = "block";
          el("attach-label").textContent = file.name;
          el("attach-bar").classList.add("show");
          syncSendButton();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function onDocPicked(file) {
      if (!file) return;
      clearFile();
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        filePayload = {
          kind: "doc",
          dataUrl: null,
          base64: dataUrl.split(",")[1],
          mimeType: file.type || "application/octet-stream",
          name: file.name,
        };
        el("attach-doc-ico").style.display = "inline";
        el("attach-label").textContent = file.name;
        el("attach-bar").classList.add("show");
        syncSendButton();
      };
      reader.readAsDataURL(file);
    }

    function renderHistory() {
      const list = el("history-list");
      list.innerHTML = "";
      sessions.forEach((s) => {
        const div = document.createElement("div");
        div.className = "history-item" + (s.id === activeSessionId ? " active" : "");
        div.textContent = s.title;
        div.onclick = () => {
          activeSessionId = s.id;
          renderMessages();
          renderHistory();
          el("drawer-backdrop").classList.remove("open");
        };
        list.appendChild(div);
      });
    }

    async function streamReplyToBox(payload, targetBox, onComplete) {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        const errText = errData?.error || "Unable to fetch reply.";
        targetBox.innerHTML = window.marked ? marked.parse(errText) : errText;
        onComplete(errText);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const dataStr = trimmed.slice(5).trim();
          if (dataStr === "[DONE]") continue;
          try {
            const parsed = JSON.parse(dataStr);
            if (parsed.token) {
              fullText += parsed.token;
              targetBox.innerHTML = window.marked ? marked.parse(fullText) : fullText;
              el("chat-stage").scrollTop = el("chat-stage").scrollHeight;
            }
          } catch (_) {}
        }
      }

      const finalOut = fullText.trim() || "Jawab generate nahi ho paya.";
      targetBox.innerHTML = window.marked ? marked.parse(finalOut) : finalOut;
      onComplete(finalOut);
    }

    async function regenerateIndex(aiIdx) {
      if (busy) return;
      const s = currentSession();
      let uIdx = aiIdx - 1;
      while (uIdx >= 0 && s.messages[uIdx].role !== "user") uIdx--;
      if (uIdx < 0) return;

      const userMsg = s.messages[uIdx];
      const history = s.messages
        .slice(0, uIdx)
        .slice(-6)
        .filter((m) => m.text)
        .map((m) => ({ role: m.role, text: m.text }));

      busy = true;
      syncSendButton();
  s.messages[aiIdx] = { role: "model", text: "" };
      renderMessages();

      const boxes = el("chat-container").querySelectorAll(".ai-box");
      const targetBox = boxes[boxes.length - 1];
      if (targetBox) {
        targetBox.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
      }

      try {
        await streamReplyToBox(
          {
            message: userMsg.text || "",
            history,
            mode,
            imageBase64: userMsg.image ? userMsg.image.split(",")[1] : null,
            imageMimeType: userMsg.image ? "image/jpeg" : null,
          },
          targetBox,
          (finalReply) => {
            s.messages[aiIdx] = { role: "model", text: finalReply };
            persist();
          }
        );
      } catch (_) {
        s.messages[aiIdx] = { role: "model", text: "Connection error. Please try again." };
        persist();
      } finally {
        busy = false;
        renderMessages();
        syncSendButton();
      }
    }

    function renderMessages() {
      const s = currentSession();
      const box = el("chat-container");
      box.innerHTML = "";

      if (!s.messages.length) {
        box.innerHTML = `
          <div class="hero-empty">
            <h1>How can I help?</h1>
            <p>High-accuracy answers, live search, photo & PDF analysis.</p>
            <div class="quick-grid">
              <button class="quick-card" data-q="Solve step-by-step: Average of 11 numbers is 50. First 6 average is 49 and last 6 is 52. Find the 6th number.">SSC Average Problem</button>
              <button class="quick-card" data-q="Give a crisp 30-day SSC GK & Quant revision strategy">30-Day SSC Strategy</button>
              <button class="quick-card" data-q="Explain JavaScript async/await with a clean working example">JS Async/Await</button>
              <button class="quick-card" data-q="What is today's date, day, and current time in India?">Today's Date & Day</button>
            </div>
          </div>
        `;
        box.querySelectorAll(".quick-card").forEach((btn) => {
          btn.onclick = () => sendPrompt(btn.dataset.q);
        });
        return;
      }

      s.messages.forEach((m, idx) => {
        if (m.role === "user") {
          const wrap = document.createElement("div");
          wrap.className = "msg-user";
          if (m.image) {
            const img = document.createElement("img");
            img.src = m.image;
            img.className = "thumb-user";
            wrap.appendChild(img);
          }
          if (m.docName) {
            const chip = document.createElement("div");
            chip.className = "file-chip-user";
            chip.textContent = m.docName;
            wrap.appendChild(chip);
          }
          if (m.text) {
            const b = document.createElement("div");
            b.className = "bubble-user";
            b.textContent = m.text;
            wrap.appendChild(b);
          }
          box.appendChild(wrap);
        } else {
          const row = document.createElement("div");
          row.className = "msg-ai";

          const av = document.createElement("div");
          av.className = "ai-avatar";
          av.textContent = "✦";

          const col = document.createElement("div");
          col.className = "ai-col";

          const content = document.createElement("div");
          content.className = "ai-box";
          content.innerHTML = m.text
            ? window.marked
              ? marked.parse(m.text)
              : m.text
            : `<div class="typing-dots"><span></span><span></span><span></span></div>`;

          col.appendChild(content);

          if (m.text && !busy) {
            const tools = document.createElement("div");
            tools.className = "ai-tools";

            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "chip-btn";
            copyBtn.textContent = "Copy";
            copyBtn.onclick = () => {
              navigator.clipboard?.writeText(m.text);
              copyBtn.textContent = "Copied ✓";
              setTimeout(() => (copyBtn.textContent = "Copy"), 1300);
            };

            const regenBtn = document.createElement("button");
            regenBtn.type = "button";
            regenBtn.className = "chip-btn";
            regenBtn.textContent = "Regenerate";
            regenBtn.onclick = () => regenerateIndex(idx);

            tools.appendChild(copyBtn);
            tools.appendChild(regenBtn);
            col.appendChild(tools);
          }

          row.appendChild(av);
          row.appendChild(col);
          box.appendChild(row);
        }
      });

      el("chat-stage").scrollTop = el("chat-stage").scrollHeight;
    }

    function syncSendButton() {
      const hasText = el("inp").value.trim().length > 0;
      const hasFile = Boolean(filePayload);
      el("btn-send").classList.toggle("go", !busy && (hasText || hasFile));
    }

    function resizeInput() {
      const ta = el("inp");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
      syncSendButton();
    }

    function startNewChat() {
      const id = "s_" + Date.now();
      sessions.unshift({ id, title: "New chat", messages: [] });
      sessions = sessions.slice(0, 15);
      activeSessionId = id;
      clearFile();
      persist();
      renderMessages();
      closePopovers();
      el("drawer-backdrop").classList.remove("open");
    }

    async function sendPrompt(rawText) {
      const text = (rawText || "").trim();
      if ((!text && !filePayload) || busy) return;

      const s = currentSession();
      if (!s.messages.length) {
        s.title = (text || filePayload?.name || "New chat").slice(0, 32);
      }

      const attached = filePayload;
      s.messages.push({
        role: "user",
        text,
        image: attached?.kind === "image" ? attached.dataUrl : null,
        docName: attached?.kind === "doc" ? attached.name : null,
      });

      const placeholderIdx = s.messages.length;
      s.messages.push({ role: "model", text: "" });

      el("inp").value = "";
      clearFile();
      resizeInput();
      busy = true;
      syncSendButton();
      persist();
      renderMessages();

      const boxes = el("chat-container").querySelectorAll(".ai-box");
      const targetBox = boxes[boxes.length - 1];

      try {
        const history = s.messages
          .slice(0, -2)
          .slice(-6)
          .filter((m) => m.text)
          .map((m) => ({ role: m.role, text: m.text }));

        await streamReplyToBox(
          {
            message: text,
            history,
            mode,
            imageBase64: attached?.kind === "image" ? attached.base64 : null,
            imageMimeType: attached?.kind === "image" ? attached.mimeType : null,
            docBase64: attached?.kind === "doc" ? attached.base64 : null,
            docMimeType: attached?.kind === "doc" ? attached.mimeType : null,
            docName: attached?.kind === "doc" ? attached.name : "",
          },
          targetBox,
          (finalReply) => {
            s.messages[placeholderIdx] = { role: "model", text: finalReply };
            persist();
          }
        );
      } catch (_) {
        s.messages[placeholderIdx] = { role: "model", text: "Connection error. Please try again." };
        persist();
      } finally {
        busy = false;
        renderMessages();
        syncSendButton();
      }
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      const rec = new SR();
      rec.lang = "hi-IN";
      rec.interimResults = true;
      let listening = false;
      let seed = "";

      rec.onstart = () => {
        listening = true;
        seed = el("inp").value.trim();
        el("btn-mic").classList.add("active-mic");
      };
      rec.onresult = (e) => {
        let out = "";
        for (let i = 0; i < e.results.length; i++) out += e.results[i][0].transcript;
        el("inp").value = seed ? `${seed} ${out}`.trim() : out.trim();
        resizeInput();
      };
      rec.onend = () => {
        listening = false;
        el("btn-mic").classList.remove("active-mic");
      };
      el("btn-mic").onclick = (e) => {
        e.stopPropagation();
        if (listening) rec.stop();
        else { try { rec.start(); } catch (_) {} }
      };
    }

    el("btn-new").onclick = startNewChat;
    el("drawer-new").onclick = startNewChat;
    el("btn-drawer").onclick = (e) => { e.stopPropagation(); closePopovers(); el("drawer-backdrop").classList.add("open"); };
    el("btn-close-drawer").onclick = () => el("drawer-backdrop").classList.remove("open");
    el("drawer-backdrop").onclick = () => el("drawer-backdrop").classList.remove("open");

    el("btn-plus").onclick = (e) => {
      e.stopPropagation();
      el("mode-popover").classList.remove("open");
      el("menu-popover").classList.remove("open");
      el("attach-menu").classList.toggle("open");
    };
    el("pick-img").onclick = () => { closePopovers(); el("img-file").click(); };
    el("pick-doc").onclick = () => { closePopovers(); el("doc-file").click(); };

    el("btn-mode").onclick = (e) => {
      e.stopPropagation();
      el("menu-popover").classList.remove("open");
      el("attach-menu").classList.remove("open");
      el("mode-popover").classList.toggle("open");
    };

    document.querySelectorAll("#mode-popover .pop-item").forEach((btn) => {
      btn.onclick = () => {
        mode = btn.dataset.mode;
        el("mode-text").textContent = mode === "Code and complex work" ? "Code" : mode;
        document.querySelectorAll("#mode-popover .chk").forEach((c) => (c.textContent = ""));
        btn.querySelector(".chk").textContent = "✓";
        closePopovers();
      };
    });

    el("btn-menu").onclick = (e) => {
      e.stopPropagation();
      el("mode-popover").classList.remove("open");
      el("attach-menu").classList.remove("open");
      el("menu-popover").classList.toggle("open");
    };

    el("opt-clear").onclick = () => {
      currentSession().messages = [];
      persist();
      renderMessages();
      closePopovers();
    };

    el("opt-reset").onclick = () => {
      sessionStorage.removeItem(STORAGE_KEY);
      localStorage.clear();
      location.reload();
    };

    el("img-file").onchange = (e) => onImagePicked(e.target.files[0]);
    el("doc-file").onchange = (e) => onDocPicked(e.target.files[0]);
    el("btn-unattach").onclick = clearFile;

    document.addEventListener("click", closePopovers);
    el("inp").addEventListener("input", resizeInput);
    el("inp").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt(el("inp").value);
      }
    });
    el("chat-form").addEventListener("submit", (e) => {
      e.preventDefault();
      sendPrompt(el("inp").value);
    });

    renderHistory();
    renderMessages();
    syncSendButton();
  </script>
</body>
</html>
