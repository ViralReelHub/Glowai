<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>GlowAI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #07080a;
      --panel: #101216;
      --card: #161920;
      --card-hover: #1e222b;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f5f8;
      --muted: #8e96a4;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #121624 0%, var(--bg) 55%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 8, 10, 0.78);
      backdrop-filter: blur(14px);
      z-index: 20;
      flex-shrink: 0;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ghost {
      height: 36px;
      padding: 0 11px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-ghost:hover {
      background: var(--card);
      border-color: var(--border);
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.8);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .mode-pill {
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .mode-pill:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Dropdowns */
    .popover {
      position: fixed;
      top: 52px;
      width: 245px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 50;
    }
    .popover.open { display: flex; }
    #mode-popover { left: 92px; }
    #menu-popover { right: 14px; width: 200px; }

    .pop-item {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
    }
    .pop-item:hover { background: var(--card-hover); }
    .pop-sub { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    /* Slide Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      z-index: 60;
    }
    .drawer-backdrop.open { display: block; }

    .drawer {
      width: 280px;
      max-width: 82vw;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 13.5px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover, .history-item.active {
      background: var(--card);
      color: var(--text);
    }

    /* Chat Stage */
    .chat-stage {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 24px;
      scroll-behavior: smooth;
    }

    .chat-container {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100%;
    }

    .hero-empty {
      margin: auto;
      text-align: center;
      max-width: 440px;
      padding: 20px;
    }

    .hero-badge {
      display: inline-block;
      font-size: 11.5px;
      color: #a5b4fc;
      background: var(--accent-soft);
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .hero-empty h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .hero-empty p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .quick-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      text-align: left;
    }

    .quick-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.4;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .quick-card:hover {
      border-color: rgba(99, 102, 241, 0.55);
      transform: translateY(-1px);
    }

    /* Messages */
    .msg-user {
      align-self: flex-end;
      max-width: 82%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .bubble-user {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      padding: 10px 15px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14.5px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .thumb-user {
      max-width: 200px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .file-chip-user {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .msg-ai {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      max-width: 100%;
    }

    .ai-avatar {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--card);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 13px;
      color: #a5b4fc;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .ai-box {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 12px 14px;
      font-size: 14.5px;
      line-height: 1.62;
    }

    .ai-box p { margin-bottom: 9px; }
    .ai-box p:last-child { margin-bottom: 0; }
    .ai-box ul, .ai-box ol { padding-left: 18px; margin-bottom: 9px; }
    .ai-box pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
    }
    .ai-box code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      height: 18px;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.1s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    /* Docked Input */
    .dock {
      padding: 8px 14px 14px;
      background: rgba(7, 8, 10, 0.85);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dock-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .attach-bar {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .attach-bar.show { display: flex; }
    .attach-bar img {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      object-fit: cover;
    }
    .attach-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .x-btn {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }

    .input-shell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 6px 8px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .input-shell:focus-within {
      border-color: rgba(99, 102, 241, 0.65);
    }

    .tool-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tool-icon:hover {
      background: var(--card-hover);
      color: var(--text);
    }
    .tool-icon.active-mic {
      background: #dc2626;
      color: #fff;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.45;
      max-height: 140px;
      resize: none;
      padding: 7px 4px;
    }
    textarea::placeholder { color: var(--muted); }

    .send-arrow {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: none;
      background: var(--card-hover);
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-arrow.go {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <input type="file" id="img-file" accept="image/*" hidden />
  <input type="file" id="doc-file" accept=".pdf,.txt,.md,.csv,.json,application/pdf,text/plain" hidden />

  <header class="topbar">
    <div class="top-left">
      <button class="btn-ghost" id="btn-drawer" title="History">☰</button>
      <div class="btn-ghost" style="cursor:default;">
        <span class="brand-dot"></span>
        <span class="brand-title">GlowAI</span>
      </div>
      <button class="mode-pill" id="btn-mode">
        <span id="mode-text">Auto</span>
        <span>▾</span>
      </button>
    </div>
    <div class="top-left">
      <button class="btn-ghost" id="btn-new" title="New chat">+ New</button>
      <button class="btn-ghost" id="btn-menu" title="Options">⋮</button>
    </div>
  </header>

  <div class="popover" id="mode-popover">
    <button class="pop-item" data-mode="Auto">
      <div><strong>Auto</strong><span class="pop-sub">Fast & balanced</span></div>
      <span class="chk">✓</span>
    </button>
    <button class="pop-item" data-mode="Deeper analysis">
      <div><strong>Deeper analysis</strong><span class="pop-sub">Step-by-step reasoning</span></div>
      <span class="chk"></span>
    </button>
    <button class="pop-item" data-mode="Code and complex work">
      <div><strong>Code & work</strong><span class="pop-sub">Clean code & logic</span></div>
      <span class="chk"></span>
    </button>
  </div>

  <div class="popover" id="menu-popover">
    <button class="pop-item" id="opt-clear">Clear current chat</button>
    <button class="pop-item" id="opt-reset">Hard reset app</button>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop">
    <aside class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-head">
        <strong>Sessions</strong>
        <button class="btn-ghost" id="btn-close-drawer">✕</button>
      </div>
      <button class="btn-ghost" id="drawer-new" style="justify-content:center; border:1px solid var(--border);">+ Start Fresh Session</button>
      <div class="history-list" id="history-list"></div>
    </aside>
  </div>

  <main class="chat-stage" id="chat-stage">
    <div class="chat-container" id="chat-container"></div>
  </main>

  <div class="dock">
    <div class="dock-inner">
      <div class="attach-bar" id="attach-bar">
        <img id="attach-img" alt="Preview" style="display:none;" />
        <span id="attach-doc-ico" style="display:none;">📄</span>
        <span class="attach-name" id="attach-label"></span>
        <button type="button" class="x-btn" id="btn-unattach">✕</button>
      </div>
      <form class="input-shell" id="chat-form">
        <button type="button" class="tool-icon" id="btn-img" title="Attach photo">🖼</button>
        <button type="button" class="tool-icon" id="btn-doc" title="Attach PDF/Doc">📎</button>
        <textarea id="inp" rows="1" placeholder="Message GlowAI..."></textarea>
        <button type="button" class="tool-icon" id="btn-mic" title="Voice input">🎤</button>
        <button type="submit" class="send-arrow" id="btn-send" title="Send">↑</button>
      </form>
    </div>
  </div>

  <script>
    // Unregister any old service workers that might hold stale cache
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.unregister());
      });
    }

    const STORAGE_KEY = "glowai_v3_sessions";
    let mode = "Auto";
    let busy = false;
    let filePayload = null; // { kind: 'image'|'doc', dataUrl, base64, mimeType, name }

    // Always start with a clean fresh session on page load/reload
    let sessions = [];
    try {
      sessions = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "[]");
    } catch (_) {
      sessions = [];
    }

    const freshId = "s_" + Date.now();
    const freshSession = { id: freshId, title: "New session", messages: [] };
    sessions.unshift(freshSession);
    sessions = sessions.slice(0, 15);
    let activeSessionId = freshId;

    const el = (id) => document.getElementById(id);

    function persist() {
      try {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      } catch (_) {}
      renderHistory();
    }

    function currentSession() {
      return sessions.find((s) => s.id === activeSessionId) || sessions[0];
    }

    function closePopovers() {
      el("mode-popover").classList.remove("open");
      el("menu-popover").classList.remove("open");
    }

    function clearFile() {
      filePayload = null;
      el("attach-img").style.display = "none";
      el("attach-doc-ico").style.display = "none";
      el("attach-label").textContent = "";
      el("attach-bar").classList.remove("show");
      el("img-file").value = "";
      el("doc-file").value = "";
      syncSendButton();
    }

    function onImagePicked(file) {
      if (!file) return;
      clearFile();
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 880;
          let { width, height } = img;
          if (width > max || height > max) {
            if (width > height) {
              height = Math.round((height * max) / width);
              width = max;
            } else {
              width = Math.round((width * max) / height);
              height = max;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
          filePayload = {
            kind: "image",
            dataUrl,
            base64: dataUrl.split(",")[1],
            mimeType: "image/jpeg",
            name: file.name,
          };
          el("attach-img").src = dataUrl;
          el("attach-img").style.display = "block";
          el("attach-label").textContent = file.name;
          el("attach-bar").classList.add("show");
          syncSendButton();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function onDocPicked(file) {
      if (!file) return;
      clearFile();
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        filePayload = {
          kind: "doc",
          dataUrl: null,
          base64: dataUrl.split(",")[1],
          mimeType: file.type || "application/octet-stream",
          name: file.name,
        };
        el("attach-doc-ico").style.display = "inline";
        el("attach-label").textContent = file.name;
        el("attach-bar").classList.add("show");
        syncSendButton();
      };
      reader.readAsDataURL(file);
    }

    function renderHistory() {
      const list = el("history-list");
      list.innerHTML = "";
      sessions.forEach((s) => {
        const div = document.createElement("div");
        div.className = "history-item" + (s.id === activeSessionId ? " active" : "");
        div.textContent = s.title;
        div.onclick = () => {
          activeSessionId = s.id;
          renderMessages();
          renderHistory();
          el("drawer-backdrop").classList.remove("open");
        };
        list.appendChild(div);
      });
    }

    function renderMessages() {
      const s = currentSession();
      const box = el("chat-container");
      box.innerHTML = "";

      if (!s.messages.length) {
        box.innerHTML = `
          <div class="hero-empty">
            <div class="hero-badge">New Session • Fast Mode</div>
            <h1>How can I help?</h1>
            <p>Ask questions, attach photos or PDFs, or use voice input.</p>
            <div class="quick-grid">
              <button class="quick-card" data-q="Give me a crisp study plan for SSC quant & GK">SSC Quant & GK Plan</button>
              <button class="quick-card" data-q="Explain JavaScript async/await with a clean example">JS Async/Await</button>
              <button class="quick-card" data-q="Give 5 short hooks for a tech reel">Short Reel Hooks</button>
              <button class="quick-card" data-q="What is today's date and day in India?">Today's Date & Day</button>
            </div>
          </div>
        `;
        box.querySelectorAll(".quick-card").forEach((btn) => {
          btn.onclick = () => sendPrompt(btn.dataset.q);
        });
        return;
      }

      s.messages.forEach((m) => {
        if (m.role === "user") {
          const wrap = document.createElement("div");
          wrap.className = "msg-user";
          if (m.image) {
            const img = document.createElement("img");
            img.src = m.image;
            img.className = "thumb-user";
            wrap.appendChild(img);
          }
          if (m.docName) {
            const chip = document.createElement("div");
            chip.className = "file-chip-user";
            chip.textContent = "📄 " + m.docName;
            wrap.appendChild(chip);
          }
          if (m.text) {
            const b = document.createElement("div");
            b.className = "bubble-user";
            b.textContent = m.text;
            wrap.appendChild(b);
          }
          box.appendChild(wrap);
        } else {
          const row = document.createElement("div");
          row.className = "msg-ai";
          row.innerHTML = `
            <div class="ai-avatar">✦</div>
            <div class="ai-box">${window.marked ? marked.parse(m.text) : m.text}</div>
          `;
          box.appendChild(row);
        }
      });

      el("chat-stage").scrollTop = el("chat-stage").scrollHeight;
    }

    function syncSendButton() {
      const hasText = el("inp").value.trim().length > 0;
      const hasFile = Boolean(filePayload);
      el("btn-send").classList.toggle("go", !busy && (hasText || hasFile));
      el("btn-send").textContent = busy ? "…" : "↑";
    }

    function resizeInput() {
      const ta = el("inp");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
      syncSendButton();
    }

    function startNewChat() {
      const id = "s_" + Date.now();
      sessions.unshift({ id, title: "New session", messages: [] });
      sessions = sessions.slice(0, 15);
      activeSessionId = id;
      clearFile();
      persist();
      renderMessages();
      closePopovers();
      el("drawer-backdrop").classList.remove("open");
    }

    async function sendPrompt(rawText) {
      const text = (rawText || "").trim();
      if ((!text && !filePayload) || busy) return;

      const s = currentSession();
      if (!s.messages.length) {
        s.title = (text || filePayload?.name || "New session").slice(0, 32);
      }

      const attached = filePayload;
      s.messages.push({
        role: "user",
        text,
        image: attached?.kind === "image" ? attached.dataUrl : null,
        docName: attached?.kind === "doc" ? attached.name : null,
      });

      el("inp").value = "";
      clearFile();
      resizeInput();
      busy = true;
      syncSendButton();
      persist();
      renderMessages();

      const loader = document.createElement("div");
      loader.className = "msg-ai";
      loader.innerHTML = `
        <div class="ai-avatar">✦</div>
        <div class="ai-box"><div class="typing-dots"><span></span><span></span><span></span></div></div>
      `;
      el("chat-container").appendChild(loader);
      el("chat-stage").scrollTop = el("chat-stage").scrollHeight;

      try {
        const history = s.messages
          .slice(0, -1)
          .slice(-4)
          .filter((m) => m.text)
          .map((m) => ({ role: m.role, text: m.text }));

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            history,
            mode,
            imageBase64: attached?.kind === "image" ? attached.base64 : null,
            imageMimeType: attached?.kind === "image" ? attached.mimeType : null,
            docBase64: attached?.kind === "doc" ? attached.base64 : null,
            docMimeType: attached?.kind === "doc" ? attached.mimeType : null,
            docName: attached?.kind === "doc" ? attached.name : "",
          }),
        });

        const data = await res.json();
        const reply = res.ok ? data.reply : (data.error || "Unable to fetch reply.");
        s.messages.push({ role: "model", text: reply });
      } catch (_) {
        s.messages.push({ role: "model", text: "Connection error. Please try again." });
      } finally {
        busy = false;
        persist();
        renderMessages();
        syncSendButton();
      }
    }

    // Speech recognition
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      const rec = new SR();
      rec.lang = "hi-IN";
      rec.interimResults = true;
      let listening = false;
      let seed = "";

      rec.onstart = () => {
        listening = true;
        seed = el("inp").value.trim();
        el("btn-mic").classList.add("active-mic");
      };
      rec.onresult = (e) => {
        let out = "";
        for (let i = 0; i < e.results.length; i++) out += e.results[i][0].transcript;
        el("inp").value = seed ? `${seed} ${out}`.trim() : out.trim();
        resizeInput();
      };
      rec.onend = () => {
        listening = false;
        el("btn-mic").classList.remove("active-mic");
      };
      el("btn-mic").onclick = (e) => {
        e.stopPropagation();
        if (listening) rec.stop();
        else { try { rec.start(); } catch (_) {} }
      };
    }

    // Events
    el("btn-new").onclick = startNewChat;
    el("drawer-new").onclick = startNewChat;
    el("btn-drawer").onclick = (e) => { e.stopPropagation(); closePopovers(); el("drawer-backdrop").classList.add("open"); };
    el("btn-close-drawer").onclick = () => el("drawer-backdrop").classList.remove("open");
    el("drawer-backdrop").onclick = () => el("drawer-backdrop").classList.remove("open");

    el("btn-mode").onclick = (e) => {
      e.stopPropagation();
      el("menu-popover").classList.remove("open");
      el("mode-popover").classList.toggle("open");
    };

    document.querySelectorAll("#mode-popover .pop-item").forEach((btn) => {
      btn.onclick = () => {
        mode = btn.dataset.mode;
        el("mode-text").textContent = mode === "Code and complex work" ? "Code" : mode;
        document.querySelectorAll("#mode-popover .chk").forEach((c) => (c.textContent = ""));
        btn.querySelector(".chk").textContent = "✓";
        closePopovers();
      };
    });

    el("btn-menu").onclick = (e) => {
      e.stopPropagation();
      el("mode-popover").classList.remove("open");
      el("menu-popover").classList.toggle("open");
    };

    el("opt-clear").onclick = () => {
      currentSession().messages = [];
      persist();
      renderMessages();
      closePopovers();
    };

    el("opt-reset").onclick = () => {
      sessionStorage.removeItem(STORAGE_KEY);
      localStorage.clear();
      location.reload();
    };

    el("btn-img").onclick = () => el("img-file").click();
    el("btn-doc").onclick = () => el("doc-file").click();
    el("img-file").onchange = (e) => onImagePicked(e.target.files[0]);
    el("doc-file").onchange = (e) => onDocPicked(e.target.files[0]);
    el("btn-unattach").onclick = clearFile;

    document.addEventListener("click", closePopovers);
    el("inp").addEventListener("input", resizeInput);
    el("inp").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt(el("inp").value);
      }
    });
    el("chat-form").addEventListener("submit", (e) => {
      e.preventDefault();
      sendPrompt(el("inp").value);
    });

    renderHistory();
    renderMessages();
    syncSendButton();
  </script>
</body>
</html>
