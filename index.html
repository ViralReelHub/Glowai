<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: 600; font-size: 16px; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 15px; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .typing { font-style: italic; opacity: 0.75; }
    form { display: flex; gap: 10px; padding: 14px 20px; background: #1e293b; border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #3b82f6; }
    button { padding: 12px 20px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; font-size: 15px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>AI Chat Assistant</header>
  <div id="chat">
    <div class="msg ai">Namaste! Main tumhara AI assistant hoon. Kuch bhi poocho.</div>
  </div>
  <form id="chat-form">
    <input id="prompt" type="text" placeholder="Apna message likho..." autocomplete="off" required />
    <button id="send-btn" type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("prompt");
    const chat = document.getElementById("chat");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender, extraClass = "") {
      const div = document.createElement("div");
      div.className = `msg ${sender} ${extraClass}`.trim();
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      const loadingMsg = addMessage("Soch raha hoon...", "ai", "typing");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        loadingMsg.remove();

        if (!res.ok) {
          addMessage(data.error || "Kuch galat hua.", "ai");
        } else {
          addMessage(data.reply, "ai");
        }
      } catch (err) {
        loadingMsg.remove();
        addMessage("Network error aaya. Dobara try karo.", "ai");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
